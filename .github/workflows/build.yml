name: build

# Knect 4 built on Windows with MSVC, its suites run (the window's launch among them), and Knect4.exe kept as the
# run's artifact; its line coverage held to 95 %; and the C++ held to clang-format 22.1.8. The repository is private,
# so the jobs run on the organisation's self-hosted runners. The window is built on the toolkit, a private submodule
# read through its read-only deploy key (.github/actions/toolkit).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fresh:
        description: Build from nothing, the kept build tree removed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A newer push to a pull request supersedes its run; every commit on main keeps a result of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
      - name: The toolkit submodule
        uses: ./.github/actions/toolkit
        with:
          deploy-key: ${{ secrets.RECKLESS_TOOLKIT_DEPLOY_KEY }}
          require-on-main: "true"
      - name: Tidy the workspace
        run: |
          if ('${{ github.event.inputs.fresh }}' -eq 'true') { 'fresh: removing the kept tree'; Remove-Item -Recurse -Force build/ci -ErrorAction SilentlyContinue }
          if (Test-Path build/ci/CMakeCache.txt) { 'build/ci kept from the last run' } else { 'build/ci: building from nothing' }
      # The MSVC developer environment of the Visual Studio vswhere finds, for the later steps; FetchContent's downloads
      # kept in the runner's tool cache between runs, by compiler.
      - name: Toolchain
        id: cpp
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No Visual Studio with the x64 C++ tools found" }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          cmd.exe /c "`"$devcmd`" -arch=x64 -host_arch=x64 -no_logo && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            }
          }
          $deps = Join-Path $env:RUNNER_TOOL_CACHE "knect4-deps\msvc"
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          "Visual Studio: $vs; dependencies: $deps"
          "deps=$deps" >> $env:GITHUB_OUTPUT
      - name: Configure
        run: >
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
          "-DFETCHCONTENT_BASE_DIR=${{ steps.cpp.outputs.deps }}"
      - name: Build
        run: cmake --build build/ci -j $env:NUMBER_OF_PROCESSORS
      # Every suite: the game's (its search held to the original's own games), the window's, and the window's launch,
      # which the runner's service draws on a window station that shows nothing.
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure -j $env:NUMBER_OF_PROCESSORS
      - name: Upload the executable
        uses: actions/upload-artifact@v6
        with:
          name: knect4-windows
          path: build/ci/src/app/Knect4.exe
          if-no-files-found: error
          retention-days: 30

  # Line coverage of the game's own code (src/ but the app's entry point), gcc's, read by gcovr 8.3: a debug build
  # instrumented, every suite and the render tool's runs on Linux, red under 95 % of lines. The window's launch is left
  # to the Windows job (it needs a display); on a desk, tools/coverage-windows.ps1 measures the same with clang-cl.
  # This is also the game's own Linux build. Kept tree build/ci-coverage; its counters cleared before every run.
  coverage:
    name: Coverage (Linux, gcc)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
      - name: The toolkit submodule
        uses: ./.github/actions/toolkit
        with:
          deploy-key: ${{ secrets.RECKLESS_TOOLKIT_DEPLOY_KEY }}
      # What the build needs - the compiler, CMake, Ninja, and what Skia, the child window and ALSA link - looked up by
      # name, installed with the runner's passwordless sudo where missing; gcovr in a venv of the tool cache.
      - name: Toolchain
        id: cpp
        run: |
          set -euo pipefail
          apt_line="build-essential cmake ninja-build pkg-config python3-venv libfreetype-dev libfontconfig1-dev libx11-dev libasound2-dev"
          find_missing() {
            missing=""
            for tool in g++ cmake ninja pkg-config python3; do command -v "$tool" > /dev/null || missing="$missing $tool"; done
            for package in freetype2 fontconfig x11 alsa; do pkg-config --exists "$package" 2> /dev/null || missing="$missing $package.pc"; done
          }
          find_missing
          if [ -n "$missing" ] && sudo -n true 2> /dev/null; then
            echo "the runner lacks:$missing - installing"
            sudo -n apt-get update -qq
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $apt_line
            find_missing
          fi
          if [ -n "$missing" ]; then echo "::error::the runner lacks:$missing. sudo apt install $apt_line"; exit 1; fi
          gcovr="$RUNNER_TOOL_CACHE/gcovr-8.3"
          if [ ! -x "$gcovr/bin/gcovr" ]; then python3 -m venv "$gcovr" && "$gcovr/bin/pip" install --quiet gcovr==8.3; fi
          deps="$RUNNER_TOOL_CACHE/knect4-deps/gcc$(g++ -dumpversion | cut -d. -f1)"
          mkdir -p "$deps"
          g++ --version | head -1
          { echo "gcovr=$gcovr/bin/gcovr"; echo "deps=$deps"; echo "jobs=$(nproc)"; } >> "$GITHUB_OUTPUT"
      - name: Configure
        run: >
          cmake -S . -B build/ci-coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug -DKNECT4_COVERAGE=ON
          -DFETCHCONTENT_UPDATES_DISCONNECTED=ON "-DFETCHCONTENT_BASE_DIR=${{ steps.cpp.outputs.deps }}"
      - name: Build
        run: cmake --build build/ci-coverage -j ${{ steps.cpp.outputs.jobs }}
      - name: Test
        run: |
          find build/ci-coverage -name '*.gcda' -delete
          ctest --test-dir build/ci-coverage --output-on-failure -j ${{ steps.cpp.outputs.jobs }} -LE '^window$'
      - name: Coverage, 95 % of lines or red
        run: >
          mkdir -p build/ci-coverage/coverage &&
          "${{ steps.cpp.outputs.gcovr }}" --root . --filter 'src/' --exclude 'src/app/main[.]cpp' build/ci-coverage
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file
          --print-summary --txt build/ci-coverage/coverage.txt --html-details build/ci-coverage/coverage/index.html
          --fail-under-line 95
      - name: The report
        if: always()
        run: cat build/ci-coverage/coverage.txt || true
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: knect4-coverage
          path: build/ci-coverage/coverage
          if-no-files-found: ignore
          retention-days: 30

  format:
    name: clang-format
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
      - name: clang-format 22.1.8
        run: |
          venv="$RUNNER_TOOL_CACHE/clang-format-22.1.8"
          if [ ! -x "$venv/bin/clang-format" ]; then
            python3 -m venv "$venv"
            "$venv/bin/pip" install --quiet 'clang-format==22.1.8'
          fi
          "$venv/bin/clang-format" --version
          files=$(git ls-files -- 'src/*.h' 'src/*.cpp' 'tests/*.h' 'tests/*.cpp')
          echo "$(echo "$files" | grep -c .) files"
          "$venv/bin/clang-format" --dry-run -Werror $files
