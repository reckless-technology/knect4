# Wakes the website when a Knect 4 release is published.
#
# Knect 4 publishes its draft release in place (`gh release edit vX.Y.Z --draft=false --latest`), which fires
# `release: published`. The website builds its download page and update manifest from the newest public release, but
# only when its `pages.yml` runs; this sends it the `knect4-release` repository_dispatch it accepts, so the new
# version shows at once rather than at the website's daily run, which stays the fallback if this fails or is skipped.
#
# Needs the organisation secret PUBLIC_RELEASES_TOKEN (visible to all repositories): a fine-grained token of Jonny's
# with Contents read and write on website and the public release repositories. The built-in GITHUB_TOKEN cannot dispatch to another repository, which is why a
# token of its own is needed. `workflow_dispatch` fires it by hand.
name: Notify website

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The website told
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the organisation secret PUBLIC_RELEASES_TOKEN is not set or not visible to this repository; it is a fine-grained token of Jonny's with Contents read and write on website and the public release repositories (organisation Settings > Secrets and variables > Actions). The website's daily run will pick the release up meanwhile."
            exit 1
          fi
          gh api repos/reckless-technology/website/dispatches -f event_type=knect4-release
          echo "the website was sent knect4-release"
